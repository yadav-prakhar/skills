<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
<title id="t">Layered lighting concept</title><desc id="d">Four bands explain ambient, task, accent and decorative lighting.</desc>
<rect width="960" height="560" rx="28" fill="#f6f3ed"/>
<text x="56" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#252525">Think in layers, not fixture counts</text>
<text x="56" y="108" font-family="Arial,sans-serif" font-size="16" fill="#555">Each source needs a job and a plausible power/control path.</text>
<g font-family="Arial,sans-serif">
<rect x="56" y="150" width="848" height="78" rx="14" fill="#e7e1d5"/><circle cx="104" cy="189" r="22" fill="#c6a86b"/><path d="M104 157v-12m0 88v-12m-32-32H60m88 0h-12" stroke="#795f32" stroke-width="3" stroke-linecap="round"/><text x="150" y="183" font-size="21" font-weight="700" fill="#252525">Ambient</text><text x="150" y="207" font-size="15" fill="#555">General illumination and safe movement</text>
<rect x="56" y="244" width="848" height="78" rx="14" fill="#e5e9e7"/><rect x="84" y="266" width="40" height="30" rx="5" fill="#8ca39b"/><text x="150" y="277" font-size="21" font-weight="700" fill="#252525">Task</text><text x="150" y="301" font-size="15" fill="#555">Focused light for reading, grooming, work or cooking</text>
<rect x="56" y="338" width="848" height="78" rx="14" fill="#ece5e8"/><path d="M82 392l22-40 22 40z" fill="#b28b9c"/><text x="150" y="371" font-size="21" font-weight="700" fill="#252525">Accent</text><text x="150" y="395" font-size="15" fill="#555">Highlights art, texture or architectural features</text>
<rect x="56" y="432" width="848" height="78" rx="14" fill="#e7e8ef"/><path d="M84 477h40l-8-24H92z" fill="#8e93b5"/><text x="150" y="465" font-size="21" font-weight="700" fill="#252525">Decorative</text><text x="150" y="489" font-size="15" fill="#555">The fixture itself contributes visual character</text>
</g>
<text x="56" y="540" font-family="Arial,sans-serif" font-size="13" fill="#666">Concept guide only — verify output, glare, mounting, switching and electrical supply on site.</text>
</svg>